  .jua-regular {
    font-family: "Jua", sans-serif;
    font-weight: 400;
    font-style: normal;
  }

  * {
    font-family: "Jua", sans-serif;
    box-sizing: border-box;
  }

  body {
    height: 100%;
    min-height: 100vh;
    background: 
      url("https://assets.manacake.co/status-cafe/chiikawa/bgGrass.webp"),
      var(--bg-main);
    background-attachment: fixed;
    padding: 24px 24px 24px 24px;
  }

  main {
    padding-bottom: 80px;
  }

  a {
    font-weight: 400;
    color: var(--link-color);
    text-decoration: underline;
    text-underline-offset: 4px;
    &:hover {
      color: var(--link-color-hover);
      text-decoration-style: wavy;
    }
  }

  /* Statuses column title */
  h2 {
    margin: 24px 0;
    padding: 8px 24px;
    color: var(--text-color);
    font-size: var(--text-size);
    font-weight: 400;
    letter-spacing: 0.05em;
    background-color: #FFF9ED;
    border-radius: 24px;
    outline: 3px solid #EEDBC4;
    filter: drop-shadow(2px 3px 2px rgba(138, 93, 64, 0.25));
  }

  nav {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: var(--text-size);
    letter-spacing: 0.05em;
    & a {
      padding: 2px 10px 2px 35px;
      text-decoration: none;
      border-radius: 24px;
      background-color: var(--nav-bg-color);
      filter: drop-shadow(2px 3px 2px rgba(138, 93, 64, 0.25));
      &:hover {
        background-color: var(--nav-bg-color-hover);
        color: var(--link-color-hover);
        &::before {
          transform: translateY(-3px);
          background-image: var(--nav-icon-hover);
        }
      }
      &::before {
        content: '';
        position: absolute;
        top: 5px;
        left: 10px;
        width: 19px;
        height: 19px;
        background-image: var(--nav-icon);
        transition: transform 0.2s ease-out, background-image 0.2s ease-out;
      }
    }
  }

  /* Profile column */
  section:first-child {
    position: relative;
    /* Account name */
    & h2 {
      display: none;
    }

    /* User provided pic */
    & .profile-picture {
      width: auto;
      max-width: 250px;
      border-radius: 24px;
      margin-top: 24px;
      margin-bottom: 24px;
      filter: drop-shadow(2px 3px 2px rgba(138, 93, 64, 0.25));
    }

    /* Profile content box */
    & dl {
      padding: 27px;
      font-size: var(--text-size);
      letter-spacing: 0.05em;
      color: var(--text-color);
      background-color: #FFFFFF;
      border-radius: 24px;
      outline: solid 3px var(--text-color);
      outline-offset: -7px;
      /* Warning: Using filter causes footer positioning issues??? */
      box-shadow: 2px 3px 2px 0px rgba(138, 93, 64, 0.25);
    }

    /* Profile labels */
    & dt.homepage,
    & dt.email,
    & dt.about {
      display: inline-block;
      margin-bottom: 6px;
      background-image: var(--bg-radial-gradient);
      background-clip: text;
      color: transparent;
    }

    /* Profile values */
    & dd.homepage,
    & dd.email {
      margin-left: 0;
      margin-bottom: 12px;
    }
    & dd.about {
      margin: 0;
    }

    /* Under the homepage label, if you want to add your website button, uncomment block and adjust background url below */
    & dd.homepage a {
      /* &::before {
        content: '';
        display: block;
        width: 88px;
        height: 31px;
        background: url("https://assets.manacake.co/button-manacakeco.png");
        image-rendering: pixelated;
      } */
    }

    /* Toggle email visibility here: default set to display no email */
    & dt.email,
    & dd.email {
      display: none;
    }

    /* Subscribe via atom link button */
    & p {
      position: absolute;
      top: 0;
      left: 0;
      margin-top: -27px;
      & a {
        display: inline-flex;
        text-decoration: none;
        padding: 2px 10px 2px 35px;
        border-radius: 24px;
        font-size: var(--text-size);
        letter-spacing: 0.05em;
        text-transform: lowercase;
        background-color: var(--nav-bg-color);
        filter: drop-shadow(2px 3px 2px rgba(138, 93, 64, 0.25));
        &:hover {
          color: var(--link-color-hover);
          background-color: var(--nav-bg-color-hover);
          &::before {
            transform: translateY(-3px);
            background-image: var(--nav-icon-hover);
          }
        }
        &::before {
          content: '';
          position: absolute;
          top: 5px;
          left: 10px;
          width: 19px;
          height: 19px;
          background-image: var(--nav-icon);
          background-size: contain;
          background-repeat: no-repeat;
          transition: transform 0.2s ease-out, background-image 0.2s ease-out;
        }
      }
    }

    /* Adjust the position of profile content depending on existence of user's pic */
    &:not(:has(.profile-picture)) dl {
      margin-top: 260px;
    }
    &:has(.profile-picture) dl {
      margin-top: 0px;
    }

    /* Adjust visibility of Chiikawa/Hachiware's profile pic if user has their own */
    &:not(:has(.profile-picture)) img.chiikawa {
      display: block;
      top: 20px;
    }
    &:has(.profile-picture) img.chiikawa {
      display: none;
    }
    &:not(:has(.profile-picture)) img.hachiware {
      display: block;
    }
    &:has(.profile-picture) img.hachiware {
      display: none;
    }
  }

  /* Newer / Older statuses link */
  section:nth-child(2) > p:last-child {
    display: flex;
    justify-content: space-between;
    filter: drop-shadow(2px 3px 2px rgba(138, 93, 64, 0.25));
    & a {
      padding: 8px 24px;
      text-decoration: none;
      background: var(--bg-radial-gradient);
      border-radius: 32px;
      border: 3px solid #FF6192;
      outline: 3px solid #FFFFFF;
      font-size: var(--text-size);
      letter-spacing: 0.05em;
      color: #FFFFFF;
      transition: transform 0.2s ease-out;
      &:hover {
        background: var(--bg-radial-gradient-hover);
        border-color: #4084B4;
        transform: translateY(-3px);
      }
    }
  }

  .status {
    margin-bottom: 20px;
    padding: 20px 24px;
    font-size: var(--text-size);
    letter-spacing: 0.05em;
    color: var(--text-color);
    border-radius: 24px;
    outline: solid 3px var(--text-color);
    outline-offset: -7px;
    background-color: #FFFFFF;
    filter: drop-shadow(2px 3px 2px rgba(138, 93, 64, 0.25));
  }

  .status-username {
    position: relative;
    margin-left: 70px;
    color: var(--link-color);
  }

  .status-content {
    position: relative;
    margin: 12px 12px 0 70px;
  }

  /* Status character decoration */
  .status .status-username::before {
    content: '';
    position: absolute;
    left: -70px;
    background-position: top left;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    height: 60px;
    background-image: var(--bg-img);
    width: var(--bg-width);
  }
  .status:nth-child(7n)   { --bg-width: 56px; --bg-img: url("https://assets.manacake.co/status-cafe/chiikawa/shisaOrange.webp"); }
  .status:nth-child(7n+1) { --bg-width: 60px; --bg-img: url("https://assets.manacake.co/status-cafe/chiikawa/chiikawaPeach.webp"); }
  .status:nth-child(7n+2) { --bg-width: 49px; --bg-img: url("https://assets.manacake.co/status-cafe/chiikawa/hachiwareBlueberry.webp"); }
  .status:nth-child(7n+3) { --bg-width: 62px; --bg-img: url("https://assets.manacake.co/status-cafe/chiikawa/usagiBanana.webp"); }
  .status:nth-child(7n+4) { --bg-width: 51px; --bg-img: url("https://assets.manacake.co/status-cafe/chiikawa/kurimanjuKiwi.webp"); }
  .status:nth-child(7n+5) { --bg-width: 59px; --bg-img: url("https://assets.manacake.co/status-cafe/chiikawa/momongaGrape.webp"); }
  .status:nth-child(7n+6) { --bg-width: 50px; --bg-img: url("https://assets.manacake.co/status-cafe/chiikawa/rakkoStrawberry.webp"); }

  /* Chiikawa's profile pic gets inserted if user has no profile pic */
  .chiikawa {
    z-index: 2;
    position: absolute;
    left: 0;
    width: 250px;
    filter: drop-shadow(2px 3px 2px rgba(138, 93, 64, 0.25));
    transform: translateY(0);
    transition: transform 0.2s ease-out;
    &:hover {
      transform: translateY(-3px);
      & + .hachiware {
        /* These values are relative to the initial 75px/50px position */
        transform: translate(-84px, -40px);
      }
    }
  }
  /* Hachiware is hiding behind Chiikawa */
  .hachiware {
    z-index: 1;
    position: absolute;
    rotate: -18deg;
    top: 75px;
    left: 50px;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Credit toggle */
  .toggle-input {
    display: none;
  }

  /* Toggle label */
  .toggle-label {
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
    background-image: var(--bg-radial-gradient);
    background-clip: text;
    color: transparent;
  }

  /* Toggle logic */
  .label-text-hide { 
    display: none;
  }
  .toggle-input:checked ~ .toggle-label .label-text-show {
    display: none;
  }
  .toggle-input:checked ~ .toggle-label .label-text-hide {
    display: inline;
  }

  /* Toggle animation */
  .secret-wrapper {
    display: grid;
    grid-template-rows: 0fr; /* Collapsed state */
    transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }
  .toggle-input:checked ~ .secret-wrapper {
    grid-template-rows: 1fr; /* Expanded state */
  }

  /* Inner content needs min-height: 0 for the toggle grid trick to work */
  .secret-content {
    min-height: 0;
    padding-top: 10px;
  }

  /* Background decorations */
  .bg-tree {
    z-index: -1;
    position: fixed;
    top: 100px;
    right: 0px;
    width: 420px;
  }

  .bg-tree-2 {
    z-index: -1;
    position: fixed;
    top: -50px;
    left: -20px;
  }

  /* Footer decorations */
  .bg-forest {
    z-index: -1;
    position: fixed;
    right: 0;
    bottom: -520px;
    width: 2560px;
    height: 685px;
    transform: scaleX(-1);
    background: url("https://assets.manacake.co/status-cafe/chiikawa/bgBush.webp");
    background-repeat: no-repeat;
  }

  .bg-forest-body {
    z-index: -1;
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100vw;
    height: 90px;
    padding: 10px;
    background: #B0D7A2;
  }

  .bg-fluff {
    z-index: 1;
    position: fixed;
    bottom: 40px;
    left: 0;
    width: 2558px;
    height: 55px;
    filter: drop-shadow(-2px -4px 4px rgba(138, 93, 64, 0.1));
    background: url("https://assets.manacake.co/status-cafe/chiikawa/bgFluff.webp");
  }

  .footer-body {
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100vw;
    height: auto;
    padding-bottom: 12px;
    background: #FFFFFF;
    color: var(--text-color);
  }

  /* Cursed friend dolls */
  .footer-img {
    width: 30px;
    transition: transform 0.2s ease-out;
    &.usagi {
      width: 35px;
    }
    &:hover {
      transform: translateY(-3px);
      cursor: help;
    }
  }

  /* Mobile specific adjustments */
  @media (width < 755px) {
    body {
      padding-left: 0;
      padding-right: 0;
    }

    main {
      padding-left: 24px;
      padding-right: 24px;
    }

    nav {
      justify-content: flex-start;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 5px;
      padding-left: 24px;
      padding-right: 24px;
    }
    
    /* Subscribe via atom link */
    section:first-child {
      & p {
        margin-top: 12px;
      }
    }

    /* Profile content */
    section:first-child {
      &:not(:has(.profile-picture)) dl {
        margin-top: 290px;
      }
      &:not(:has(.profile-picture)) img.chiikawa {
